<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>Secretary Dashboard — BLUE DOME</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles-pages.css" />
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="i18n.js"></script>
  <script src="i18n-pages.js"></script>
  <script src="data.js"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="shell.jsx"></script>
  <script type="text/babel" src="kpi-and-waitingroom.jsx"></script>
  <script type="text/babel" src="schedule.jsx"></script>
  <script type="text/babel" src="panels.jsx"></script>
  <script type="text/babel" src="pages-ops.jsx"></script>
  <script type="text/babel" src="pages-admin.jsx"></script>

  <script type="text/babel">
    function PageDashboard() {
      return (
        <div className="page" data-screen-label="Dashboard">
          <header className="page-header">
            <div>
              <h1>{t("page_title")}</h1>
              <div className="sub">{t("page_subtitle")}</div>
            </div>
            <div className="actions">
              <span className="live-pill">
                <span className="blink" />
                LIVE
              </span>
              <button className="btn-secondary"><IconPrinter size={13} />{window.__LANG==="fr"?"Imprimer":window.__LANG==="ar"?"طباعة":"Print"}</button>
            </div>
          </header>

          <KpiStrip />

          <div className="grid-2col">
            <WaitingRoom />
            <WhatsappPanel />
          </div>

          <ScheduleStrip selectedDocs={window.__selectedDocs || ["d1","d2"]} />

          <div className="grid-2col">
            <ChecklistCard />
            <div className="card" style={{padding:"16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"12px"}}>
                <div className="kpi-chip tint-info"><IconPhone size={15} /></div>
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>{window.__LANG==="fr"?"File d'appels — relances":window.__LANG==="ar"?"قائمة الاتصال — متابعة":"Call queue — follow-ups"}</div>
                  <div style={{fontSize:12,color:"var(--text-muted)"}}>{window.__LANG==="fr"?"Patients sans réponse WhatsApp après 24h":window.__LANG==="ar"?"مرضى بدون رد واتساب بعد 24س":"Patients with no WhatsApp reply after 24h"}</div>
                </div>
              </div>
              {[
                {p:"p8", reason: window.__LANG==="fr"?"Échec WhatsApp x2":window.__LANG==="ar"?"فشل واتساب ×2":"WhatsApp failed ×2", appt:"14:00"},
                {p:"p10",reason: window.__LANG==="fr"?"Échec WhatsApp x3":window.__LANG==="ar"?"فشل واتساب ×3":"WhatsApp failed ×3", appt:"16:30"},
                {p:"p3", reason: window.__LANG==="fr"?"Sans réponse 24h":window.__LANG==="ar"?"بدون رد 24س":"No reply 24h", appt:"15:00"},
              ].map((r,i)=>{
                const p = D.patient(r.p);
                return (
                  <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderTop:i?"1px solid var(--border)":"none"}}>
                    <Avatar patient={p} />
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:13}}>{D.name(p)}</div>
                      <div style={{fontSize:11,color:"var(--text-muted)"}}>{r.reason} · {r.appt}</div>
                    </div>
                    <button className="wr-action-btn primary"><IconPhone size={12} />{window.__LANG==="fr"?"Appeler":window.__LANG==="ar"?"اتصل":"Call"}</button>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    const PAGES = {
      dashboard:    PageDashboard,
      appointments: window.PageAppointments,
      patients:     window.PagePatients,
      walkins:      window.PageWalkins,
      whatsapp:     window.PageWhatsapp,
      followups:    window.PageFollowups,
      billing:      window.PageBilling,
      payments:     window.PagePayments,
      doctors:      window.PageDoctors,
      branches:     window.PageBranches,
      reports:      window.PageReports,
      settings:     window.PageSettings,
    };

    function App() {
      const [lang, setLang] = React.useState("en");
      const [branch, setBranch] = React.useState("b1");
      const [selectedDocs, setSelectedDocs] = React.useState(["d1","d2"]);
      const [page, setPage] = React.useState("dashboard");

      React.useEffect(() => {
        window.__LANG = lang;
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
      }, [lang]);

      React.useEffect(() => {
        const docs = window.DATA.doctors.filter(d => d.branch === branch).map(d => d.id);
        setSelectedDocs(docs);
      }, [branch]);

      // Make selectedDocs available globally for PageDashboard's ScheduleStrip
      React.useEffect(() => { window.__selectedDocs = selectedDocs; }, [selectedDocs]);

      const [tick, setTick] = React.useState(0);
      React.useEffect(() => { setTick(x => x + 1); }, [lang, page]);

      // Reset scroll on page change
      React.useEffect(() => {
        const main = document.querySelector(".main");
        if (main) main.scrollTop = 0;
      }, [page]);

      const PageComp = PAGES[page] || PageDashboard;

      return (
        <div className="app" key={tick}>
          <Sidebar page={page} setPage={setPage} />
          <div className="main">
            <Topbar
              lang={lang} setLang={setLang}
              branch={branch} setBranch={setBranch}
              selectedDocs={selectedDocs} setSelectedDocs={setSelectedDocs}
            />
            <PageComp selectedDocs={selectedDocs} />
          </div>
          <QuickDock />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
